name: Build MuscuLog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Downgrade Project Format
        run: |
          # Force the project objectVersion back to 56 (Xcode 15 compatible)
          # to bypass the format 77 error without triggering Xcode 16's actool bug.
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/g' MuscuLog.xcodeproj/project.pbxproj

      - name: Build app
        run: |
          xcodebuild build \
            -project MuscuLog.xcodeproj \
            -scheme MuscuLog \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MuscuLog.app Payload/
          zip -r MuscuLog.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuscuLog-ipa
          path: MuscuLog.ipa
          retention-days: 90
